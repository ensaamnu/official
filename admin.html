<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم | ENSAA × MNU</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body{font-family:'Cairo',sans-serif;padding:24px clamp(16px,4vw,56px)}
.box{max-width:760px;margin:0 auto 24px;border:1px solid var(--line);border-radius:6px;padding:24px;background:rgba(3,21,46,.6)}
label{display:block;margin:12px 0 4px;color:var(--champ);font-size:15px}
input,select,textarea{width:100%;background:var(--deep);color:#fff;border:1px solid var(--line);border-radius:4px;padding:10px;font:inherit;box-sizing:border-box}
textarea{min-height:110px}
button{background:none;color:var(--champ);border:1px solid var(--lgold);border-radius:999px;padding:8px 22px;font:inherit;font-weight:600;cursor:pointer;margin:12px 6px 0 0}
button:hover{background:var(--lgold);color:var(--ink)}
.tabs button.on{background:var(--lgold);color:var(--ink)}
.row{display:grid;grid-template-columns:2fr 1fr;gap:10px}
#msg{min-height:1.5em;margin:0 auto 16px;max-width:760px;font-weight:600}
.ok{color:#7fe3a6}.bad{color:#ff8a8a}
small.h{color:var(--gray);display:block;margin-top:4px}
.live{margin:10px 0;padding:12px;border:1px solid var(--line);border-radius:4px}
.live h3{margin:2px 0 0;font-size:17px}
[hidden]{display:none!important}
</style>
</head>
<body>
<h2 style="text-align:center;max-width:760px;margin:0 auto 16px">لوحة التحكم</h2>
<p id="msg"></p>

<div class="box" id="lg">
<label>الريبو على GitHub (اسم_المستخدم/الريبو)</label><input id="repo" value="ensaamnu/official" dir="ltr">
<label>GitHub Token</label><input id="tk" type="password" dir="ltr" autocomplete="off">
<small class="h">Fine-grained token لريبو الموقع بس، بصلاحية Contents: Read and write. الشخص لازم يكون Collaborator على الريبو.</small>
<label><input type="checkbox" id="rem" style="width:auto"> تذكرني على الجهاز ده</label>
<button id="go" type="button">دخول</button>
</div>

<div id="app" hidden>
<div class="box tabs" style="text-align:center;padding:10px"><button id="t1" class="on" type="button">الأخبار</button><button id="t2" type="button">اللجان</button><button id="out" type="button">خروج</button></div>

<div id="p1">
<div class="box">
<h3 id="ft" style="margin-top:0">خبر جديد</h3>
<input type="hidden" id="id"><input type="hidden" id="im">
<div class="row"><div><label>العنوان *</label><input id="title"></div><div><label>التاريخ</label><input id="date" type="date"></div></div>
<label>اللجنة</label><select id="cm"><option value="">عام (كل الجمعية)</option><option>SCOPH</option><option>SCONE</option><option>SCOSRE</option><option>ETDD</option><option>Media</option></select>
<label>النص</label><textarea id="text"></textarea>
<label>العنوان بالإنجليزي (اختياري)</label><input id="title_en" dir="ltr">
<label>النص بالإنجليزي (اختياري)</label><textarea id="text_en" dir="ltr"></textarea>
<label>رابط للمزيد (اختياري)</label><input id="link" dir="ltr" placeholder="https://">
<label>صورة (اختياري)</label><input id="img" type="file" accept="image/*"><small class="h" id="cur"></small>
<button id="sv" type="button">حفظ ونشر</button><button id="rs" type="button">جديد</button>
</div>
<div class="box"><h3 style="margin-top:0">الأخبار الحالية</h3><div id="nl"></div></div>
</div>

<div id="p2" hidden>
<div class="box">
<label>اللجنة</label><select id="ck"><option>SCOPH</option><option>SCONE</option><option>SCOSRE</option><option>ETDD</option><option>Media</option></select>
<div class="row"><div><label>أمين اللجنة</label><input id="s0"></div><div><label>الفرقة (1-4)</label><input id="y0" type="number" min="0" max="4"></div></div>
<div class="row"><div><label>مساعد أمين اللجنة</label><input id="s1"></div><div><label>الفرقة (1-4)</label><input id="y1" type="number" min="0" max="4"></div></div>
<label>الأعضاء (سطر لكل عضو: الاسم | الفرقة)</label><textarea id="mem"></textarea>
<label>الأنشطة (سطر لكل نشاط: التاريخ | العنوان | الوصف)</label><textarea id="act"></textarea>
<small class="h">التاريخ بصيغة 2026-11-03. ماتستخدمش علامة | جوه النص.</small>
<button id="sc" type="button">حفظ ونشر</button>
</div>
</div>
</div>
<script src="admin.js"></script>
</body>
</html>
